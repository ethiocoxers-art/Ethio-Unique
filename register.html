<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Registration | Ethio Unique</title>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    body {
      background-color: #f7f7f7;
      font-family: 'Montserrat', sans-serif;
    }

    .register-container {
      max-width: 600px;
      margin: 3rem auto;
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .register-container h2 {
      color: #00796b;
      text-align: center;
      margin-bottom: 1rem;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.3rem;
      font-weight: 600;
      color: #004d40;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 0.8rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #00796b;
      outline: none;
    }

    .btn-submit {
      background-color: #00796b;
      color: white;
      padding: 0.9rem 1.5rem;
      border: none;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .btn-submit:hover {
      background-color: #004d40;
    }

    .form-footer {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="register-container">
    <h2>Student Registration</h2>
    <form id="registrationForm">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" name="name" id="name" required/>
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" name="email" id="email" required/>
      </div>
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" name="phone" id="phone" required/>
      </div>
      <div class="form-group">
        <label for="course">Select Course</label>
        <select name="course" id="course" required>
          <option value="">-- Choose a course --</option>
          <option value="Web Development Basics">Web Development Basics</option>
          <option value="Cybersecurity Essentials">Cybersecurity Essentials</option>
          <option value="Graphic Design with Canva">Graphic Design with Canva</option>
          <option value="Coding for Beginners">Coding for Beginners</option>
        </select>
      </div>
      <button type="submit" class="btn-submit">Register</button>
    </form>
    <div class="form-footer">
      Already registered? <a href="mailto:ethio.unique@support.com">Contact support</a>
    </div>
  </div>

  <script>
    const form = document.getElementById("registrationForm");

    form.addEventListener("submit", async function (e) {
      e.preventDefault();

      const formData = {
        name: form.name.value,
        email: form.email.value,
        phone: form.phone.value,
        course: form.course.value,
      };

      try {
        const response = await fetch("http://localhost:3000/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(formData),
        });

        const result = await response.json();
        alert(result.message || "Thank you for registering!");
        form.reset();
      } catch (error) {
        alert("Something went wrong!");
        console.error(error);
      }
    });
  </script>

</body>
</html>
